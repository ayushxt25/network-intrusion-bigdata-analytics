name: network-intrusion-bigdata-analytics

services:
  spark-master:
    image: apache/spark:3.5.6
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/spark/sbin/start-master.sh && tail -f /dev/null"]
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data:/workspace/data
      - ./artifacts:/workspace/artifacts
    mem_limit: 1g
    cpus: 1.0

  spark-worker:
    image: apache/spark:3.5.6
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"]
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./data:/workspace/data
      - ./artifacts:/workspace/artifacts
    mem_limit: 4g
    cpus: 3.0

  analytics:
    build:
      context: .
      dockerfile: docker/analytics.Dockerfile
    profiles: ["jobs"]
    depends_on:
      - spark-master
      - spark-worker
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.memory=1g
      - --conf
      - spark.executor.memory=2g
      - --conf
      - spark.executor.cores=2
      - /workspace/processing/smoke_test.py
      - --output-path
      - /workspace/artifacts/smoke_parquet
    volumes:
      - ./:/workspace
    mem_limit: 2g
    cpus: 2.0

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    depends_on:
      - spark-master
    ports:
      - "8501:8501"
    volumes:
      - ./:/app:ro
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SMOKE_PARQUET_PATH: /app/artifacts/smoke_parquet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  hadoop-init:
    image: apache/hadoop:3.3.6
    profiles: ["hadoop"]
    user: "0:0"
    entrypoint: ["bash", "/opt/project-hadoop/init-volumes.sh"]
    volumes: ["hadoop_name:/data/dfs/name", "hadoop_data:/data/dfs/data", "./hadoop:/opt/project-hadoop:ro"]

  namenode:
    image: apache/hadoop:3.3.6
    profiles: ["hadoop"]
    depends_on:
      hadoop-init:
        condition: service_completed_successfully
    entrypoint: ["bash", "/opt/project-hadoop/start-namenode.sh"]
    volumes: ["hadoop_name:/data/dfs/name", "./hadoop-conf:/opt/hadoop/etc/hadoop:ro", "./hadoop:/opt/project-hadoop:ro"]
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports: ["9870:9870", "8020:8020"]
    mem_limit: 768m
    cpus: 1.0
  datanode:
    image: apache/hadoop:3.3.6
    profiles: ["hadoop"]
    command: ["hdfs","datanode"]
    depends_on:
      hadoop-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
    volumes: ["hadoop_data:/data/dfs/data", "./hadoop-conf:/opt/hadoop/etc/hadoop:ro"]
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1):'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
  resourcemanager:
    image: apache/hadoop:3.3.6
    profiles: ["hadoop"]
    command: ["yarn","resourcemanager"]
    depends_on:
      namenode:
        condition: service_healthy
    volumes: ["./hadoop-conf:/opt/hadoop/etc/hadoop:ro"]
    ports: ["8088:8088"]
    healthcheck:
      test: ["CMD-SHELL", "yarn node -list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
  nodemanager:
    image: apache/hadoop:3.3.6
    profiles: ["hadoop"]
    command: ["yarn","nodemanager"]
    depends_on:
      resourcemanager:
        condition: service_healthy
      datanode:
        condition: service_healthy
    volumes: ["./hadoop-conf:/opt/hadoop/etc/hadoop:ro"]
    healthcheck:
      test: ["CMD-SHELL", "yarn node -list 2>/dev/null | grep -q RUNNING"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 3g
    cpus: 2.0
  hadoop-jobs:
    build: {context: ., dockerfile: docker/hadoop-jobs.Dockerfile}
    profiles: ["hadoop"]
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      nodemanager:
        condition: service_healthy
    volumes: ["./:/workspace", "./hadoop-conf:/opt/hadoop/etc/hadoop:ro"]
    working_dir: /workspace
    environment:
      HADOOP_USER_NAME: hadoop
    entrypoint: ["bash", "hadoop/run_mapreduce.sh"]
    mem_limit: 1g
    cpus: 1.0
  r-analysis:
    build: {context: ., dockerfile: docker/r.Dockerfile}
    profiles: ["r"]
    volumes: ["./:/workspace"]
    working_dir: /workspace
    entrypoint: ["Rscript","r/aggregate_analysis.R"]
    mem_limit: 512m
    cpus: 0.5

volumes:
  hadoop_name:
  hadoop_data:
